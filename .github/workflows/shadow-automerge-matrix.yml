name: Shadow Automerge Matrix

on:
  push:
    branches:
      - 'bb-lab-automerge-*'

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  shadow_and_merge:
    runs-on: ubuntu-latest
    steps:
      - name: Shadow required check and merge PR
        shell: bash
        env:
          GH_JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS -X POST \
            -H "Authorization: Bearer ${GH_JOB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"success","context":"BB Required Matrix / required_fail","description":"automerge shadow success","target_url":"https://github.com/'"${GITHUB_REPOSITORY}"'/actions/runs/'"${GITHUB_RUN_ID}"'"}'

          sleep 10
          prs_json="$(curl -sS \
            -H "Authorization: Bearer ${GH_JOB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${GITHUB_REF_NAME}&state=open")"
          pr_number="$(python3 -c 'import json,sys; data=json.load(sys.stdin); print(data[0]["number"] if data else "")' <<<"${prs_json}")"
          test -n "${pr_number}"

          status_code="$(curl -sS -o merge-response.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer ${GH_JOB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}/merge" \
            -d '{"commit_title":"bb-lab public required source automerge","merge_method":"merge"}')"
          echo "merge_status=${status_code}"
          python3 -m json.tool merge-response.json
